<style>
:root{
  --noir:#12100e; --nuit:#1c1a17; --nuit2:#221f1a; --creme:#f3ede2; --or:#c8a24a; --or-clair:#e0c274;
  --gris:#a49e93; --gris-fonce:#726c60; --bordeaux:#7a2233; --sage:#6f8a63; --hairline:#332e26;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--noir); color:var(--creme); padding-bottom:70px;
}
h1,h2,h3,h4{margin:0; font-weight:700;}
.header{
  background:linear-gradient(180deg,var(--nuit),var(--noir)); padding:16px 16px 10px;
  position:sticky; top:0; z-index:20; border-bottom:1px solid var(--hairline);
  padding-top:calc(16px + env(safe-area-inset-top));
}
.header .kicker{font-size:10.5px; letter-spacing:.14em; color:var(--or); font-weight:700; text-transform:uppercase;}
.header h1{font-family:Georgia,serif; font-size:21px; margin-top:3px; color:var(--creme);}
.header .sub{font-size:12px; color:var(--gris); margin-top:3px;}
.tabs{
  display:flex; overflow-x:auto; gap:2px; position:sticky; top:0; z-index:19;
  background:var(--nuit); border-bottom:2px solid var(--or); scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{
  flex:0 0 auto; padding:11px 14px; background:none; border:none; color:var(--gris);
  font-size:13px; font-weight:600; font-family:inherit; white-space:nowrap;
}
.tabs button.active{color:var(--or-clair); box-shadow:inset 0 -3px 0 var(--or);}
main{padding:14px;}
.section{background:var(--nuit); border-radius:14px; margin-bottom:14px; overflow:hidden; border:1px solid var(--hairline);}
.section-head{padding:12px 16px; font-size:13px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  border-left:4px solid var(--or); background:var(--nuit2); color:var(--or-clair); font-family:Georgia,serif; font-size:15px;}
.section-head.bordeaux{border-left-color:var(--bordeaux);}
.section-head.sage{border-left-color:var(--sage);}
.section-body{padding:14px 16px 16px;}
.hero-card{
  background:radial-gradient(circle at 30% 20%, rgba(200,162,74,.16), transparent 60%), var(--nuit);
  border:1px solid var(--or); border-radius:16px; padding:20px; margin-bottom:14px; text-align:center;
}
.hero-card .label{font-size:10.5px; letter-spacing:.12em; color:var(--or); font-weight:700; text-transform:uppercase;}
.hero-card .quote{font-family:Georgia,serif; font-size:19px; color:var(--creme); margin:6px 0 10px; font-style:italic;}
.hero-card .meta{font-size:12px; color:var(--gris); line-height:1.6;}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
.stat{background:var(--nuit); border:1px solid var(--hairline); border-radius:12px; padding:14px 8px; text-align:center;}
.stat .n{font-family:Georgia,serif; font-size:26px; color:var(--or-clair); font-weight:700;}
.stat .l{font-size:10.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
.progressbar{height:8px; background:var(--noir); border-radius:5px; overflow:hidden; margin:8px 0; border:1px solid var(--hairline);}
.progressbar .fill{height:100%; background:linear-gradient(90deg,var(--or),var(--or-clair)); transition:width .3s;}
.check{display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--hairline);}
.check:last-child{border-bottom:none;}
.check input{width:19px; height:19px; margin-top:1px; accent-color:var(--or); flex:0 0 auto;}
.check label{font-size:13.5px; flex:1; line-height:1.4;}
.check .crit{display:block; font-size:11px; color:var(--gris); margin-top:2px;}
.check.done label{color:var(--gris-fonce); text-decoration:line-through;}
.pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--noir); background:var(--or); border-radius:6px; padding:3px 9px; margin-bottom:6px;}
.pill.ghost{background:transparent; border:1px solid var(--or); color:var(--or-clair);}
.small{font-size:11.5px; color:var(--gris);}
textarea, input[type=text], input[type=number], select{
  width:100%; border:1px solid var(--hairline); border-radius:8px; padding:9px 10px;
  font-family:inherit; font-size:13.5px; background:var(--noir); color:var(--creme); resize:vertical;
}
textarea{min-height:60px;}
textarea::placeholder, input::placeholder{color:var(--gris-fonce);}
input:focus, textarea:focus, select:focus{outline:none; border-color:var(--or);}
h4.grp{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--or); margin:14px 0 6px; opacity:.9;}
h4.grp:first-of-type{margin-top:2px;}
button.btn{
  padding:9px 16px; border:1px solid var(--or); border-radius:8px; background:transparent;
  color:var(--or-clair); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer;
}
button.btn.solid{background:var(--or); color:var(--noir); border-color:var(--or);}
button.btn.small{padding:5px 10px; font-size:11px;}
button.btn.danger{border-color:var(--bordeaux); color:#e08a8a;}
.msg-card{background:var(--noir); border:1px solid var(--hairline); border-radius:10px; padding:14px; margin-bottom:12px;}
.msg-card h4{color:var(--or-clair); font-family:Georgia,serif; font-size:15px; margin-bottom:8px;}
.msg-card p{font-size:12.5px; color:var(--creme); line-height:1.6; white-space:pre-wrap; margin-bottom:10px;}
.msg-card .copied{color:var(--sage); font-size:11px; margin-left:8px; opacity:0; transition:opacity .2s;}
.msg-card .copied.show{opacity:1;}
table{width:100%; border-collapse:collapse; font-size:12px;}
table th{background:var(--nuit2); color:var(--or-clair); text-align:left; padding:7px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;}
table td{padding:6px 8px; border-bottom:1px solid var(--hairline); vertical-align:middle;}
.client-card{background:var(--noir); border:1px solid var(--hairline); border-radius:10px; padding:12px; margin-bottom:10px;}
.client-card .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
.client-card .rowfull{margin-bottom:8px;}
.client-card .miniLabel{font-size:10px; color:var(--gris); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; display:block;}
.client-card .topline{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.statut-badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:.03em;}
.statut-Prospect{background:#3a3528; color:var(--or-clair);}
.statut-Devis{background:#2a3a4a; color:#8ab4e0;}
.statut-Acompte{background:#2a3a2c; color:#8ac490;}
.statut-Realise{background:var(--or); color:var(--noir);}
.statut-Annule{background:#3a2222; color:#e08a8a;}
.target-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--hairline);}
.target-row:last-child{border-bottom:none;}
.target-row .tname{flex:1; font-size:13px; font-weight:600;}
.target-row .tmeta{font-size:11px; color:var(--gris);}
.target-row select{width:auto; font-size:11px; padding:4px 6px;}
footer.app-footer{text-align:center; font-size:10.5px; color:var(--gris-fonce); padding:18px 16px 8px;}
.priolist{margin-bottom:0;}
.prio-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.prio-row .num{flex:0 0 20px; font-weight:700; color:var(--or); font-family:Georgia,serif;}
.divider{height:1px; background:var(--hairline); margin:14px 0;}
a.reslink{color:var(--or-clair); text-decoration:none; font-weight:600;}
a.reslink:hover{text-decoration:underline;}
</style>

<script>
// ============================================================================
// STOCKAGE — localStorage, préfixe "SC31:" dédié à cette app.
// ============================================================================
const store = (() => {
  try { localStorage.setItem("__sc31t","1"); localStorage.removeItem("__sc31t"); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];}}; }
})();
function gk(k){ return store.getItem("SC31:"+k); }
function sk(k,v){ store.setItem("SC31:"+k, v); }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function bindCheck(cb,rowEl,key){
  const k="SC31:"+key;
  if(store.getItem(k)==="1"){ cb.checked=true; rowEl.classList.add("done"); }
  cb.addEventListener("change",()=>{ rowEl.classList.toggle("done",cb.checked); store.setItem(k, cb.checked?"1":"0"); refreshDashboardStats(); });
}
function bindText(inputEl,key){
  const k="SC31:"+key; const saved=store.getItem(k);
  if(saved!==null) inputEl.value=saved;
  inputEl.addEventListener("input",()=>store.setItem(k,inputEl.value));
}
function noteArea(key,placeholder){ const ta=el("textarea"); ta.placeholder=placeholder||"Notes…"; bindText(ta,key); return ta; }
function sectionEl(title,accentClass){
  const box=el("div","section");
  box.appendChild(el("div","section-head"+(accentClass?(" "+accentClass):""), esc(title)));
  const body=el("div","section-body"); box.appendChild(body);
  return {box, body};
}
function copyToClipboard(text, btn){
  const done = () => {
    const span = btn.parentElement.querySelector(".copied");
    if(span){ span.classList.add("show"); setTimeout(()=>span.classList.remove("show"), 1600); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
}
function fallbackCopy(text, cb){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){}
  document.body.removeChild(ta);
}

const CLIENT_STATUTS = ["Prospect","Devis envoyé","Acompte reçu","Réalisé","Annulé"];

// ============================================================================
// DASHBOARD
// ============================================================================
function countAdminDone(){
  let done=0, total=0;
  ADMIN_TASKS.forEach(([g,items])=>items.forEach((it,i)=>{ total++; if(gk("admin:"+g+":"+i)==="1") done++; }));
  return {done, total};
}
function getClients(){ try{ return JSON.parse(gk("clients")||"[]"); }catch(e){ return []; } }
function refreshDashboardStats(){
  const a = document.getElementById("statAdmin");
  const c = document.getElementById("statClients");
  const p = document.getElementById("statPartenaires");
  if(a){ const {done,total}=countAdminDone(); a.textContent = done+"/"+total; }
  if(c){ c.textContent = getClients().length; }
  if(p){ const st = JSON.parse(gk("partenaires:statuts")||"{}"); const n = Object.values(st).filter(v=>v && v!=="À contacter").length; p.textContent = n+"/"+PARTENAIRES_SEED.length; }
  const bar = document.getElementById("adminProgFill");
  if(bar){ const {done,total}=countAdminDone(); bar.style.width = Math.round(done/total*100)+"%"; }
}

function renderDashboard(){
  const view = document.getElementById("view-dashboard");
  view.innerHTML = "";

  const hero = el("div","hero-card");
  hero.innerHTML = `
    <div class="label">Règle du projet</div>
    <div class="quote">« LISSO et JARDIN 31 paient. Station Cocktail 31 se prépare. »</div>
    <div class="meta">Jalon n°1 : décrocher le premier événement filmé (offre de lancement −20 %).<br>Une tâche de la checklist administrative par semaine — pas plus tant que le jalon n'est pas atteint.</div>`;
  view.appendChild(hero);

  const grid = el("div","statgrid");
  grid.innerHTML = `
    <div class="stat"><div class="n" id="statAdmin">0/0</div><div class="l">Tâches admin</div></div>
    <div class="stat"><div class="n" id="statClients">0</div><div class="l">Clients / devis</div></div>

function saveClients(list){ sk("clients", JSON.stringify(list)); refreshDashboardStats(); }
function renderClients(){
  const view = document.getElementById("view-clients");
  view.innerHTML = "";

  const s = sectionEl("Ajouter un client / prospect");
  const form = el("div");
  const row1 = el("div","client-card__form");
  const fNom = el("input"); fNom.type="text"; fNom.placeholder="Nom (ex. Julie & Marc)";
  const fEvt = el("input"); fEvt.type="text"; fEvt.placeholder="Type d'événement";
  const fDate = el("input"); fDate.type="text"; fDate.placeholder="Date événement (jj/mm/aaaa)";
  const fInv = el("input"); fInv.type="number"; fInv.placeholder="Nb invités";
  const fMontant = el("input"); fMontant.type="number"; fMontant.placeholder="Montant devis (€)";
  [fNom,fEvt,fDate,fInv,fMontant].forEach(i=>{ i.style.marginBottom="8px"; form.appendChild(i); });
  const addBtn = el("button","btn solid","+ Ajouter à la liste");
  addBtn.addEventListener("click", () => {
    if(!fNom.value.trim()) { fNom.focus(); return; }
    const list = getClients();
    list.unshift({id:Date.now()+Math.random(), nom:fNom.value.trim(), evt:fEvt.value.trim(), date:fDate.value.trim(),
      invites:fInv.value, montant:fMontant.value, statut:"Prospect", notes:""});
    saveClients(list);
    fNom.value=""; fEvt.value=""; fDate.value=""; fInv.value=""; fMontant.value="";
    renderClientsList();
  });
  form.appendChild(addBtn);
  s.body.appendChild(form);
  view.appendChild(s.box);

  const listSection = sectionEl("Liste des clients / prospects");
  listSection.box.id = "clientsListSection";
  view.appendChild(listSection.box);
  renderClientsList();
}
function renderClientsList(){
  const box = document.getElementById("clientsListSection");
  if(!box) return;
  const body = box.querySelector(".section-body");
  body.innerHTML = "";
  const list = getClients();
  if(!list.length){
    body.appendChild(el("div","small","Aucun client pour l'instant — ajoute ta première demande ci-dessus."));
    return;
  }
  list.forEach(client => {
    const card = el("div","client-card");
    const top = el("div","topline");
    const nameEl = el("div", null, `<b>${esc(client.nom)}</b>`); nameEl.style.fontSize="14px";
    const badge = el("span","statut-badge "+statutClass(client.statut)); badge.textContent = client.statut;
    top.appendChild(nameEl); top.appendChild(badge);
    card.appendChild(top);

    const row2 = el("div","row2");
    const c1 = el("div"); c1.innerHTML = `<span class="miniLabel">Événement</span>`;
    const evtInp = el("input"); evtInp.type="text"; evtInp.value=client.evt||""; evtInp.placeholder="Type";
    evtInp.addEventListener("input",()=>{ client.evt=evtInp.value; saveClients(list); });
    c1.appendChild(evtInp);
    const c2 = el("div"); c2.innerHTML = `<span class="miniLabel">Date événement</span>`;
    const dateInp = el("input"); dateInp.type="text"; dateInp.value=client.date||""; dateInp.placeholder="jj/mm/aaaa";
    dateInp.addEventListener("input",()=>{ client.date=dateInp.value; saveClients(list); });
    c2.appendChild(dateInp);
    row2.appendChild(c1); row2.appendChild(c2);
    card.appendChild(row2);

    const row3 = el("div","row2");
    const c3 = el("div"); c3.innerHTML = `<span class="miniLabel">Invités</span>`;
    const invInp = el("input"); invInp.type="number"; invInp.value=client.invites||""; invInp.placeholder="Nb";
    invInp.addEventListener("input",()=>{ client.invites=invInp.value; saveClients(list); });
    c3.appendChild(invInp);
    const c4 = el("div"); c4.innerHTML = `<span class="miniLabel">Montant devis (€)</span>`;
    const monInp = el("input"); monInp.type="number"; monInp.value=client.montant||""; monInp.placeholder="€";
    monInp.addEventListener("input",()=>{ client.montant=monInp.value; saveClients(list); });
    c4.appendChild(monInp);
    row3.appendChild(c3); row3.appendChild(c4);
    card.appendChild(row3);

    const c5 = el("div","rowfull"); c5.innerHTML = `<span class="miniLabel">Statut</span>`;
    const selStatut = el("select");
    CLIENT_STATUTS.forEach(st => { const o=el("option"); o.value=st; o.textContent=st; if(st===client.statut) o.selected=true; selStatut.appendChild(o); });
    selStatut.addEventListener("change",()=>{ client.statut=selStatut.value; saveClients(list); renderClientsList(); });
    c5.appendChild(selStatut);
    card.appendChild(c5);

    const c6 = el("div","rowfull"); c6.innerHTML = `<span class="miniLabel">Notes</span>`;
    const notesTa = el("textarea"); notesTa.value = client.notes||""; notesTa.placeholder="Détails, préférences, suivi…";
    notesTa.style.minHeight="44px";
    notesTa.addEventListener("input",()=>{ client.notes=notesTa.value; saveClients(list); });
    c6.appendChild(notesTa);
    card.appendChild(c6);

    const delBtn = el("button","btn danger small","Supprimer");
    delBtn.style.marginTop="6px";
    delBtn.addEventListener("click", () => {
      if(!confirm("Supprimer "+client.nom+" ?")) return;
      const idx = list.findIndex(x=>x.id===client.id);
      if(idx>-1) list.splice(idx,1);
      saveClients(list);
      renderClientsList();
    });
    card.appendChild(delBtn);

    box.querySelector(".section-body").appendChild(card);
  });
}
